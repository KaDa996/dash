<style>

:root {
    font-family: system-ui, sans-serif;
    font-size: 16px;
    --dark-color: #5c6378ff;
    --light-color: #edf2f4ff;
    --card-border: #DADADA;
    --background-color: #2b2d42ff;
    --secondary-color: #757e93ff;
    --antiflash-white: #edf2f4ff;
    --important-color: #ef233cff;
    --fire-engine-red: #d90429ff;
    --card-padding-x: 1rem;
    --card-padding-y: 1rem;
    --card-padding-y-lg: 2rem;
    --card-padding-x-lg: 2rem;
    --card-body-gap: 1rem;
    --card-text: #1a1a1a;
      --keyvalue-gap: 0.5rem;
  --keyvalue-key: #454545;
  --keyvalue-value: #1a1a1a;
}

body {
    background-color: var(--background-color);
    color: var(--light-color);
    margin: 0;
}

article {
    background-color: var(--light-color);
    color: var(--dark-color);
    padding: 1rem;
    margin-bottom: 1rem;
    min-width: 10rem;
    min-height: 10rem;
}

.header{ 
    display: flex;
    gap:auto;
}
article figure {
    margin: 0;
}

img {
    display: block;
    width: 100%;
}

main {
    width: 90%;
    max-width: 1200px;
    margin-inline: auto;
    padding-block-start: 2rem;
}

.bento {
    --bento-cols: 7;
    --bento-rows: 4;
    --bento-border-radius: 1rem;
    --bento-gap: 1rem;
    display: grid;
     grid-template-columns: repeat(var(--bento-cols), 1fr);
    grid-template-rows: repeat(var(--bento-rows), 1fr);
    width: 100%;
    aspect-ratio: var(--bento-cols) / var(--bento-rows);
    grid-template-areas: 
    "Tasks-L Tasks-L Tasks-L Tasks-M Tasks-M "
    "Tasks-L Tasks-L Tasks-L Tasks-M Tasks-M"
    "Tasks-L Tasks-L Tasks-L empty-box empty-box"
    "Tasks-S Tasks-S Tasks-XS empty-box empty-box" ;
}

.bento > * {
    overflow: hidden;
    position: relative;
    margin: calc(var(--bento-gap) / 2);
    border-radius: var(--bento-border-radius);
}

@media screen and (aspect-ratio < 1) {
    .bento {
        --bento-cols: 7;
        --bento-rows: 4;
    }
}
.bento.layout-1 > :nth-child(1) {
    grid-column: span 2;
    grid-row: span 2;
    background-color: var(--important-color);
    color: var(--light-color);
}

.bento.layout-1 > :nth-child(2) {
    grid-row: span 2;
    background-color: var(--secondary-color);
    color: var(--light-color);
}

.bento.layout-1 > :nth-child(n + 9) {
    display: none;
}

.icon {
  font-size: inherit;
  color: inherit;
  display: inline-block;
}

.icon-block {
  --icon-block-icon: #454545;
  --icon-block-background: rgba(26, 26, 26, 0.07);
  --icon-block-border: transparent;
  --icon-block-border-width: 1px;
  --icon-block-radius: 0.5rem;
  --icon-block-size: 3rem;
  --icon-block-icon-size: 1.5rem;
  background-color: var(--icon-block-background);
  border-radius: var(--icon-block-radius);
  color: var(--icon-block-icon);
  height: var(--icon-block-size);
  width: var(--icon-block-size);
  font-size: var(--icon-block-icon-size);
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-block.expressive-light {
  --icon-block-icon: var(--expressive-deep);
  --icon-block-background: var(--expressive-pale-overlay);
}
.icon-block.expressive-dark {
  --icon-block-icon: #ffffff;
  --icon-block-background: var(--expressive-rich);
}

.icon-block-xs {
  --icon-block-size: 2rem;
  --icon-block-icon-size: 1rem;
  --icon-block-radius: 0.375rem;
}

.icon-block-sm {
  --icon-block-size: 2.75rem;
  --icon-block-icon-size: 1.5rem;
  --icon-block-radius: 0.375rem;
}

.icon-block-lg {
  --icon-block-size: 3.5rem;
  --icon-block-icon-size: 1.5rem;
  --icon-block-radius: 0.5rem;
}

.icon-block-xl {
  --icon-block-size: 4rem;
  --icon-block-icon-size: 2rem;
  --icon-block-radius: 0.5rem;
}

.icon-block-xxl {
  --icon-block-size: 5rem;
  --icon-block-icon-size: 2rem;
  --icon-block-radius: 0.5rem;
}

[class^=title-] .icon, [class^=headline-] .icon, [class^=display-] .icon {
  margin-right: 0.5rem;
}

.display-03 .icon {
  margin-right: 1rem;
}

.text-block {
  --eyebrow: #595959;
}
.text-block .icon-block {
  margin-bottom: 1rem;
}
</style>
